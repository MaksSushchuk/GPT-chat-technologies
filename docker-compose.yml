version: "3.8"

services:
  backend:
    build:
      context: ./backendBook
      dockerfile: Dockerfile
    container_name: book-backend-sqlite
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backendBook:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
